name: CD

on:
  push:
    branches:
      - main
      - feature/ci-cd

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tripsense_user
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tripsense_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASS: ci-placeholder
      TRIPSENSE_TESTCONTAINERS_ENABLED: "false"
      TRIP_DB_HOST: localhost
      TRIP_DB_PORT: 5432
      TRIP_DB_NAME: tripsense_trip
      TRIP_DB_USER: postgres
      TRIP_DB_PASS: ci-placeholder
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-placeholder-access-secret-12345678901234567890
      JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-12345678901234567890
      RESEND_API_KEY: ci-placeholder
      EMAIL_SERVICE_URL: http://localhost:8082
      ZIOMAP_API_KEY: ci-placeholder

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create TripSense test databases
        env:
          PGPASSWORD: ci-placeholder
        run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE tripsense_trip;"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test all services
        run: mvn -B -T 1C verify

  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd'
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: web
            context: apps/web/tripsense
            dockerfile: apps/web/tripsense/Dockerfile

          - image: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile

          - image: discovery-server
            context: .
            dockerfile: services/discovery-server/Dockerfile

          - image: place-service
            context: .
            dockerfile: services/place-service/Dockerfile

          - image: user-service
            context: .
            dockerfile: services/user-service/Dockerfile

          - image: mail-service
            context: .
            dockerfile: services/mail-service/Dockerfile

          - image: trip-service
            context: .
            dockerfile: services/trip-service/Dockerfile

          - image: social-service
            context: .
            dockerfile: services/social-service/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production compose
        env:
          IMAGE_REGISTRY: docker.io
          IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_PROJECT: tripsense
          IMAGE_TAG: ${{ github.sha }}
          DB_USER: postgres
          DB_PASS: ci-placeholder
          USER_DB_USER: postgres
          USER_DB_PASS: ci-placeholder
          TRIP_DB_USER: postgres
          TRIP_DB_PASS: ci-placeholder
          SOCIAL_DB_NAME: tripsense_social
          SOCIAL_DB_USER: postgres
          SOCIAL_DB_PASS: ci-placeholder
          JWT_ACCESS_SECRET: ci-placeholder-access-secret-12345678901234567890
          JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-12345678901234567890
          RESEND_API_KEY: ci-placeholder
          ZIOMAP_API_KEY: ci-placeholder
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          CLOUDINARY_SOCIAL_FOLDER: tripsense/social
        run: docker compose -f deploy/docker-compose.prod.yml config

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tripsense-${{ matrix.image }}:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tripsense-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd'

    runs-on:
      - self-hosted
      - Linux
      - X64

    needs: publish

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check deployment files
        run: |
          pwd
          ls -la deploy
          ls -la deploy/nginx
          ls -la scripts

      - name: Prepare deployment directory
        run: |
          mkdir -p /opt/tripsense/deploy/nginx

          cp deploy/docker-compose.prod.yml /opt/tripsense/deploy/docker-compose.yml
          cp scripts/deploy.sh /opt/tripsense/deploy/deploy.sh
          cp deploy/nginx/nginx.conf /opt/tripsense/deploy/nginx/nginx.conf

          chmod +x /opt/tripsense/deploy/deploy.sh

      - name: Deploy TripSense to Azure
        env:
          IMAGE_REGISTRY: docker.io
          IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_PROJECT: tripsense
          IMAGE_TAG: ${{ github.sha }}

        run: |
          /opt/tripsense/deploy/deploy.sh
