name: CD

on:
  push:
    branches:
      - main
      - feature/ci-cd

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test all services
        run: mvn -B clean verify

  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd'
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile

          - image: discovery-server
            context: .
            dockerfile: services/discovery-server/Dockerfile

          - image: place-service
            context: .
            dockerfile: services/place-service/Dockerfile

          - image: user-service
            context: ./services/UserService
            dockerfile: services/UserService/Dockerfile

          - image: email-service
            context: ./services/EmailService
            dockerfile: services/EmailService/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tripsense-${{ matrix.image }}:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tripsense-${{ matrix.image }}:latest

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd'

    runs-on:
      - self-hosted
      - Linux
      - X64

    needs: publish

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy TripSense to Azure
        env:
          IMAGE_REGISTRY: docker.io
          IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_PROJECT: tripsense
          IMAGE_TAG: ${{ github.sha }}

        run: |
          cd /opt/tripsense
          chmod +x deploy.sh
          ./deploy.sh