name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test all services
        run: |
          mvn -B clean verify
          mvn -B -f services/UserService/pom.xml clean verify
          mvn -B -f services/EmailService/pom.xml clean verify

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      matrix:
        include:
          - image_name: api-gateway
            maven_args: -pl services/api-gateway -am
            docker_context: .
            dockerfile: services/api-gateway/Dockerfile
          - image_name: discovery-server
            maven_args: -pl services/discovery-server -am
            docker_context: .
            dockerfile: services/discovery-server/Dockerfile
          - image_name: place-service
            maven_args: -pl services/place-service -am
            docker_context: .
            dockerfile: services/place-service/Dockerfile
          - image_name: user-service
            maven_args: -f services/UserService/pom.xml
            docker_context: services/UserService
            dockerfile: services/UserService/Dockerfile
          - image_name: email-service
            maven_args: -f services/EmailService/pom.xml
            docker_context: services/EmailService
            dockerfile: services/EmailService/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package service
        run: mvn -B ${{ matrix.maven_args }} package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.docker_context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tripsense-${{ matrix.image_name }}:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tripsense-${{ matrix.image_name }}:latest

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - X64

    needs: publish

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy TripSense to Azure
        run: |
          cd /opt/tripsense
          ./deploy.sh
