name: CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - "feature/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test all services
        run: mvn -B clean verify

  docker-build:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker images
        env:
          IMAGE_REGISTRY: docker.io
          IMAGE_OWNER: phatnguyen105
          IMAGE_PROJECT: tripsense
          IMAGE_TAG: ci-${{ github.sha }}

          DB_USER: postgres
          DB_PASS: ci-placeholder
          JWT_ACCESS_SECRET: ci-placeholder-access-secret-12345678901234567890
          JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-12345678901234567890
          RESEND_API_KEY: ci-placeholder

        run: docker compose build