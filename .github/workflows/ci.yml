name: CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - feature/**

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test all services
        run: mvn -B clean verify

  docker-build:
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - booking-service
          - payment-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package service
        run: mvn -B -pl backend/${{ matrix.service }} -am package -DskipTests

      - name: Build Docker image
        run: |
          docker build \
            -t tripsense-platform-${{ matrix.service }}:${{ github.sha }} \
            ./backend/${{ matrix.service }}