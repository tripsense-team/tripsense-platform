server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://api-gateway:8080/health;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8080/;
    }

    location /api/users/ {
        proxy_pass http://user-service:8080/;
    }

    location /api/bookings/ {
        proxy_pass http://booking-service:8080/;
    }

    location /api/payments/ {
        proxy_pass http://payment-service:8080/;
    }
}
