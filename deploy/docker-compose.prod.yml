services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api-gateway
      - auth-service
      - user-service
      - booking-service
      - payment-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  api-gateway:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-api-gateway:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8080:8080"

  auth-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-auth-service:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8081:8080"

  user-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-user-service:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8082:8080"

  booking-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-booking-service:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8083:8080"

  payment-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-payment-service:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8084:8080"
