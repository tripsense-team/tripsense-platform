services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripsense_user
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  trip-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripsense_trip
      POSTGRES_USER: ${TRIP_DB_USER}
      POSTGRES_PASSWORD: ${TRIP_DB_PASS}
    volumes:
      - trip_postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  social-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SOCIAL_DB_NAME:-tripsense_social}
      POSTGRES_USER: ${SOCIAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASS}
    volumes:
      - social_postgres_data:/var/lib/postgresql/data

  discovery-server:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-discovery-server:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"

  mail-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-mail-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      - discovery-server

  place-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-place-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/tripsense_places
      MONGODB_DATABASE: tripsense_places
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8082
      ZIOMAP_BASE_URL: https://ziomap-api.socibi.com
      ZIOMAP_API_KEY: ${ZIOMAP_API_KEY}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
    depends_on:
      - discovery-server
      - mongodb
      - redis

  user-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-user-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      USER_DB_HOST: db
      USER_DB_PORT: "5432"
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASS: ${USER_DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      EMAIL_SERVICE_URL: http://mail-service:8082
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      - db
      - mail-service

  trip-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-trip-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      TRIP_DB_HOST: trip-db
      TRIP_DB_PORT: 5432
      TRIP_DB_USER: ${TRIP_DB_USER}
      TRIP_DB_PASS: ${TRIP_DB_PASS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PLACE_SERVICE_URL: http://place-service:8082
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      - trip-db
      - redis
      - place-service
      - discovery-server

  social-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-social-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      SOCIAL_DB_HOST: social-db
      SOCIAL_DB_PORT: "5432"
      SOCIAL_DB_NAME: ${SOCIAL_DB_NAME:-tripsense_social}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER:-postgres}
      SOCIAL_DB_PASS: ${SOCIAL_DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_SOCIAL_FOLDER: ${CLOUDINARY_SOCIAL_FOLDER:-tripsense/social}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      - social-db
      - discovery-server

  api-gateway:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-api-gateway:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - redis
      - user-service
      - place-service
      - mail-service
      - trip-service
      - social-service

volumes:
  postgres_data:
  trip_postgres_data:
  mongodb_data:
  redis_data:
  social_postgres_data:
