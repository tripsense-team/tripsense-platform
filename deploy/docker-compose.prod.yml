x-java-small: &java-small
  JAVA_TOOL_OPTIONS: >-
    -XX:InitialRAMPercentage=20
    -XX:MaxRAMPercentage=55
    -XX:ActiveProcessorCount=1
    -XX:+UseSerialGC

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    depends_on:
      web:
        condition: service_started
      api-gateway:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  web:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-web:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_GATEWAY_URL: ""
      API_GATEWAY_URL: http://api-gateway:8080/api/:path*
    depends_on:
      api-gateway:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    environment:
      POSTGRES_DB: tripsense_user
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d tripsense_user"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  trip-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    environment:
      POSTGRES_DB: tripsense_trip
      POSTGRES_USER: ${TRIP_DB_USER}
      POSTGRES_PASSWORD: ${TRIP_DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRIP_DB_USER} -d tripsense_trip"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - trip_postgres_data:/var/lib/postgresql/data

  ai-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    environment:
      POSTGRES_DB: ${AI_DB_NAME:-tripsense_ai}
      POSTGRES_USER: ${AI_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AI_DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USER:-postgres} -d ${AI_DB_NAME:-tripsense_ai}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 96m
    cpus: "0.25"
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data

  social-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    environment:
      POSTGRES_DB: ${SOCIAL_DB_NAME:-tripsense_social}
      POSTGRES_USER: ${SOCIAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOCIAL_DB_USER:-postgres} -d ${SOCIAL_DB_NAME:-tripsense_social}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - social_postgres_data:/var/lib/postgresql/data

  discovery-server:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-discovery-server:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.50"
    environment:
      <<: *java-small
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "false"
      EUREKA_SERVER_PEER_NODE_READ_TIMEOUT_MS: "10000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  mail-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-mail-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 320m
    cpus: "0.50"
    environment:
      <<: *java-small
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      discovery-server:
        condition: service_healthy

  place-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-place-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      MONGODB_URI: mongodb://mongodb:27017/tripsense_places
      MONGODB_DATABASE: tripsense_places
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8082
      ZIOMAP_BASE_URL: https://ziomap-api.socibi.com
      ZIOMAP_API_KEY: ${ZIOMAP_API_KEY}
      ZIOMAP_PHOTO_DISPLAY_APPROVED: ${ZIOMAP_PHOTO_DISPLAY_APPROVED:-false}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
    depends_on:
      discovery-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-user-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      USER_DB_HOST: db
      USER_DB_PORT: "5432"
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASS: ${USER_DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      EMAIL_SERVICE_URL: http://mail-service:8082
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      db:
        condition: service_healthy
      mail-service:
        condition: service_started

  trip-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-trip-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      TRIP_DB_HOST: trip-db
      TRIP_DB_PORT: 5432
      TRIP_DB_USER: ${TRIP_DB_USER}
      TRIP_DB_PASS: ${TRIP_DB_PASS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PLACE_SERVICE_URL: http://place-service:8082
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      trip-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      place-service:
        condition: service_started
      discovery-server:
        condition: service_healthy

  social-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-social-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      SOCIAL_DB_HOST: social-db
      SOCIAL_DB_PORT: "5432"
      SOCIAL_DB_NAME: ${SOCIAL_DB_NAME:-tripsense_social}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER:-postgres}
      SOCIAL_DB_PASS: ${SOCIAL_DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_SOCIAL_FOLDER: ${CLOUDINARY_SOCIAL_FOLDER:-tripsense/social}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      social-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  ai-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-ai-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      AI_DATABASE_URL: postgresql+psycopg://${AI_DB_USER:-postgres}:${AI_DB_PASS}@ai-db:5432/${AI_DB_NAME:-tripsense_ai}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-}
      PLACE_SERVICE_URL: http://place-service:8082
      TRIP_SERVICE_URL: http://trip-service:8084
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-mock}
      EUREKA_SERVER: http://discovery-server:8761/eureka/
      AI_SERVICE_PORT: 8085
    depends_on:
      ai-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      place-service:
        condition: service_started
      trip-service:
        condition: service_started

  api-gateway:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-api-gateway:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      place-service:
        condition: service_started
      mail-service:
        condition: service_started
      trip-service:
        condition: service_started
      social-service:
        condition: service_started
      ai-service:
        condition: service_started

volumes:
  postgres_data:
  trip_postgres_data:
  mongodb_data:
  redis_data:
  social_postgres_data:
  ai_postgres_data:
