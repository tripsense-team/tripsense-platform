x-java-small: &java-small
  JAVA_TOOL_OPTIONS: >-
    -XX:InitialRAMPercentage=20
    -XX:MaxRAMPercentage=55
    -XX:ActiveProcessorCount=1
    -XX:+UseSerialGC

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    depends_on:
      web:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  web:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-web:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_GATEWAY_URL: ""
      API_GATEWAY_URL: http://api-gateway:8080/api/:path*
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_MAPVINA_API_KEY: ${NEXT_PUBLIC_MAPVINA_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
      NEXT_PUBLIC_PLACE_PHOTOS_ENABLED: "true"
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  discovery-server:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-discovery-server:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.50"
    environment:
      <<: *java-small
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "false"
      EUREKA_SERVER_PEER_NODE_READ_TIMEOUT_MS: "10000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://localhost:8761/actuator/health | grep -q ''"status":"UP"''',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  mail-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-mail-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 320m
    cpus: "0.50"
    environment:
      <<: *java-small
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      discovery-server:
        condition: service_healthy

  place-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-place-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-tripsense_places}
      REDIS_URL: ${REDIS_URL}
      SERVER_PORT: 8082
      ZIOMAP_BASE_URL: https://ziomap-api.socibi.com
      ZIOMAP_API_KEY: ${ZIOMAP_API_KEY}
      ZIOMAP_PHOTO_DISPLAY_APPROVED: ${ZIOMAP_PHOTO_DISPLAY_APPROVED:-true}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
    depends_on:
      discovery-server:
        condition: service_healthy

  user-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-user-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      USER_DATASOURCE_URL: ${USER_DATASOURCE_URL}
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASS: ${USER_DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      EMAIL_SERVICE_URL: http://mail-service:8082
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      mail-service:
        condition: service_started

  trip-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-trip-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      TRIP_DATASOURCE_URL: ${TRIP_DATASOURCE_URL}
      TRIP_DB_USER: ${TRIP_DB_USER}
      TRIP_DB_PASS: ${TRIP_DB_PASS}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PLACE_SERVICE_URL: http://place-service:8082
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      place-service:
        condition: service_started
      discovery-server:
        condition: service_healthy

  social-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-social-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      SOCIAL_DATASOURCE_URL: ${SOCIAL_DATASOURCE_URL}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER}
      SOCIAL_DB_PASS: ${SOCIAL_DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      REDIS_URL: ${REDIS_URL}
      USER_SERVICE_URL: http://user-service:8081
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_SOCIAL_FOLDER: ${CLOUDINARY_SOCIAL_FOLDER:-tripsense/social}
      TRIP_SERVICE_URL: http://trip-service:8084
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      user-service:
        condition: service_started
      trip-service:
        condition: service_started
      discovery-server:
        condition: service_healthy

  context-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-context-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      CONTEXT_SERVICE_PORT: "8087"
      CONTEXT_DATASOURCE_URL: ${CONTEXT_DATASOURCE_URL}
      CONTEXT_DB_USER: ${CONTEXT_DB_USER}
      CONTEXT_DB_PASS: ${CONTEXT_DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CONTEXT_ENCRYPTION_SECRET: ${CONTEXT_ENCRYPTION_SECRET}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy

  recommendation-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-recommendation-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      RECOMMENDATION_DATASOURCE_URL: ${RECOMMENDATION_DATASOURCE_URL}
      RECOMMENDATION_DB_USER: ${RECOMMENDATION_DB_USER}
      RECOMMENDATION_DB_PASS: ${RECOMMENDATION_DB_PASS}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PLACE_SERVICE_URL: http://place-service:8082
      USER_SERVICE_URL: http://user-service:8081
      CONTEXT_SERVICE_URL: http://context-service:8087
      TRIP_SERVICE_URL: http://trip-service:8084
      RECOMMENDATION_SEMANTIC_ENABLED: ${RECOMMENDATION_SEMANTIC_ENABLED:-false}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      place-service:
        condition: service_started
      user-service:
        condition: service_started
      context-service:
        condition: service_started
      trip-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://localhost:8088/actuator/health | grep -q ''"status":"UP"'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  ai-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-ai-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-}
      PLACE_SERVICE_URL: http://place-service:8082
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8088
      TRIP_SERVICE_URL: http://trip-service:8084
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-mock}
      EUREKA_SERVER: http://discovery-server:8761/eureka/
      AI_SERVICE_PORT: 8085
    depends_on:
      discovery-server:
        condition: service_healthy
      place-service:
        condition: service_started
      trip-service:
        condition: service_started
      recommendation-service:
        condition: service_healthy

  api-gateway:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_PROJECT}-api-gateway:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      <<: *java-small
      REDIS_URL: ${REDIS_URL}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_started
      place-service:
        condition: service_started
      mail-service:
        condition: service_started
      trip-service:
        condition: service_started
      social-service:
        condition: service_started
      context-service:
        condition: service_started
      ai-service:
        condition: service_started
      recommendation-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://localhost:8080/actuator/health | grep -q ''"status":"UP"'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
