server:
  port: ${SOCIAL_SERVICE_PORT:${SERVER_PORT:8086}}
  shutdown: graceful
spring:
  application:
    name: social-service
  datasource:
    url: jdbc:postgresql://${SOCIAL_DB_HOST:localhost}:${SOCIAL_DB_PORT:5432}/${SOCIAL_DB_NAME:tripsense_social}
    username: ${SOCIAL_DB_USER:postgres}
    password: ${SOCIAL_DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true
jwt:
  access-secret: ${JWT_ACCESS_SECRET}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder-prefix: ${CLOUDINARY_SOCIAL_FOLDER:tripsense/social}
management:
  endpoints:
    web:
      exposure:
        include: health,info
