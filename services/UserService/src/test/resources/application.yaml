server:
  port: 8081

spring:
  application:
    name: UserService

  datasource:
    url: jdbc:h2:mem:tripsense_user;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  access-secret: ${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  refresh-secret: ${JWT_REFRESH_SECRET:8Zz5u8xA?D(G+KbPeShVmYq3s6v9y$B&E)H@McQfTjWnZr4u7x!A%D*F-JaNdRg}
  access-token-expiration-ms: 900000
  refresh-token-cookie-name: refreshToken
  idle-timeout-days: 7
  absolute-timeout-days: 30
  cookie-secure: false
