server:
  port: 8081

spring:
  application:
    name: UserService

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/tripsense_user
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  refresh-secret: ${JWT_REFRESH_SECRET:8Zz5u8xA?D(G+KbPeShVmYq3s6v9y$B&E)H@McQfTjWnZr4u7x!A%D*F-JaNdRg}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-cookie-name: refreshToken
  idle-timeout-days: 7
  absolute-timeout-days: 30
  cookie-secure: false
