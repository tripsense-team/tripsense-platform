spring:
  application:
    name: place-service
  mvc:
    servlet:
      load-on-startup: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DATABASE:tripsense_place}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:tripsense_place}
      # Saved-place indexes are also installed explicitly by SavedPlaceMongoIndexMigration.
      # Keep the legacy default until all existing Place/API-key indexes have migrations.
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms

server:
  port: ${PLACE_SERVICE_PORT:${SERVER_PORT:8083}}
  shutdown: graceful

jwt:
  access-secret: ${JWT_ACCESS_SECRET:}

ziomap:
  base-url: ${ZIOMAP_BASE_URL:https://ziomap-api.socibi.com}
  api-key: ${ZIOMAP_API_KEY:}
  timeout-ms: ${ZIOMAP_TIMEOUT_MS:2500}
  photo-display-approved: ${ZIOMAP_PHOTO_DISPLAY_APPROVED:false}
  photo-max-width-px: ${ZIOMAP_PHOTO_MAX_WIDTH_PX:640}
  photo-allowed-hosts: ${ZIOMAP_PHOTO_ALLOWED_HOSTS:lh3.googleusercontent.com,ziomap-api.socibi.com}
  # Keep false until provider terms explicitly permit persistent storage and redistribution.
  photo-persistence-approved: ${ZIOMAP_PHOTO_PERSISTENCE_APPROVED:false}
  photo-persistence-license-evidence-url: ${ZIOMAP_PHOTO_PERSISTENCE_LICENSE_EVIDENCE_URL:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  place-folder-prefix: ${CLOUDINARY_PLACE_FOLDER_PREFIX:tripsense/places}

tripsense:
  explore-diagnostics:
    enabled: ${EXPLORE_DIAGNOSTICS_ENABLED:true}
  places:
    admin:
      catalog-writes-enabled: ${PLACE_ADMIN_CATALOG_WRITES_ENABLED:false}
    category-cache-read-budget: ${TRIPSENSE_PLACES_CATEGORY_CACHE_READ_BUDGET:250ms}
    media:
      health-check-enabled: ${PLACE_MEDIA_HEALTH_CHECK_ENABLED:true}
      health-check-initial-delay-ms: ${PLACE_MEDIA_HEALTH_CHECK_INITIAL_DELAY_MS:120000}
      health-check-delay-ms: ${PLACE_MEDIA_HEALTH_CHECK_DELAY_MS:3600000}
    default-city: ${DEFAULT_CITY:Da Nang}
    default-country: ${DEFAULT_COUNTRY:Vietnam}
    default-lat: ${DEFAULT_LAT:16.0544}
    default-lng: ${DEFAULT_LNG:108.2022}
    cache:
      search-ttl-seconds: ${CACHE_TTL_SEARCH_SECONDS:1800}
      details-ttl-seconds: ${CACHE_TTL_DETAILS_SECONDS:43200}
      autocomplete-ttl-seconds: ${CACHE_TTL_AUTOCOMPLETE_SECONDS:3600}
      provider-ttl-seconds: ${CACHE_TTL_PROVIDER_SECONDS:2592000}
    search:
      min-local-results: ${MIN_LOCAL_RESULTS:5}
    recommendation-service-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8088}
    recommendation-internal-api-key: ${RECOMMENDATION_INTERNAL_API_KEY:}
    encryption-secret: ${API_KEY_ENCRYPTION_SECRET:tripsense-default-api-key-encryption-secret-32b}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  health:
    mongo:
      enabled: false
    mongodb:
      enabled: false
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
