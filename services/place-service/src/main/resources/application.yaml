spring:
  application:
    name: place-service
  config:
    import: optional:file:./.env[.properties]

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

providers:
  vietmap:
    api-key: ${VIETMAP_SERVICE_KEY:}
    base-url: ${VIETMAP_BASE_URL:https://maps.vietmap.vn}
    timeout-ms: ${VIETMAP_TIMEOUT_MS:5000}
  opentripmap:
    api-key: ${OPENTRIPMAP_API_KEY:}
    base-url: ${OPENTRIPMAP_BASE_URL:https://api.opentripmap.com}
    language: ${OPENTRIPMAP_LANGUAGE:en}
    timeout-ms: ${OPENTRIPMAP_TIMEOUT_MS:5000}
  wikimedia:
    base-url: ${WIKIMEDIA_BASE_URL:https://en.wikipedia.org}
    timeout-ms: ${WIKIMEDIA_TIMEOUT_MS:5000}
