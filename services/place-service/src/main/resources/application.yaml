spring:
  application:
    name: place-service
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:false}
    redis:
      url: ${REDIS_URL}
      timeout: 2000ms

server:
  port: ${PLACE_SERVICE_PORT:${SERVER_PORT:8083}}
  shutdown: graceful

ziomap:
  base-url: ${ZIOMAP_BASE_URL:https://ziomap-api.socibi.com}
  api-key: ${ZIOMAP_API_KEY}
  timeout-ms: ${ZIOMAP_TIMEOUT_MS:8000}
  photo-display-approved: ${ZIOMAP_PHOTO_DISPLAY_APPROVED:false}
  photo-max-width-px: ${ZIOMAP_PHOTO_MAX_WIDTH_PX:640}
  photo-allowed-hosts: ${ZIOMAP_PHOTO_ALLOWED_HOSTS:lh3.googleusercontent.com,ziomap-api.socibi.com}

tripsense:
  places:
    default-city: ${DEFAULT_CITY:Da Nang}
    default-country: ${DEFAULT_COUNTRY:Vietnam}
    default-lat: ${DEFAULT_LAT:16.0544}
    default-lng: ${DEFAULT_LNG:108.2022}
    cache:
      search-ttl-seconds: ${CACHE_TTL_SEARCH_SECONDS:1800}
      details-ttl-seconds: ${CACHE_TTL_DETAILS_SECONDS:43200}
      autocomplete-ttl-seconds: ${CACHE_TTL_AUTOCOMPLETE_SECONDS:3600}
      provider-ttl-seconds: ${CACHE_TTL_PROVIDER_SECONDS:2592000}
    search:
      min-local-results: ${MIN_LOCAL_RESULTS:5}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  health:
    mongo:
      enabled: false
    mongodb:
      enabled: false
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
