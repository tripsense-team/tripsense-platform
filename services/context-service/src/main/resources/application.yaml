server:
  port: ${CONTEXT_SERVICE_PORT:8087}

spring:
  application:
    name: context-service
  datasource:
    url: jdbc:postgresql://${CONTEXT_DB_HOST:localhost}:${CONTEXT_DB_PORT:5432}/${CONTEXT_DB_NAME:tripsense_context}
    username: ${CONTEXT_DB_USER:postgres}
    password: ${CONTEXT_DB_PASS:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

jwt:
  access-secret: ${JWT_ACCESS_SECRET}

context:
  encryption:
    secret: ${CONTEXT_ENCRYPTION_SECRET:tripsense-context-onboarding-secure-key-32b}

