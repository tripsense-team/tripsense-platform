spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

server:
  port: ${API_GATEWAY_PORT:${GATEWAY_PORT:${SERVER_PORT:8080}}}
  shutdown: graceful

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}

  instance:
    prefer-ip-address: true

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info

tripsense:
  gateway:
    places-rate-limit:
      replenish-rate: ${PLACES_RATE_LIMIT_REPLENISH_RATE:10}
      burst-capacity: ${PLACES_RATE_LIMIT_BURST_CAPACITY:20}
    social-rate-limit:
      enabled: ${SOCIAL_RATE_LIMIT_ENABLED:true}
      replenish-rate: ${SOCIAL_RATE_LIMIT_REPLENISH_RATE:30}
      burst-capacity: ${SOCIAL_RATE_LIMIT_BURST_CAPACITY:60}
    client-ip:
      trusted-proxies: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
