server:
  port: ${USER_SERVICE_PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: user-service

  datasource:
    url: ${USER_DATASOURCE_URL}
    username: ${USER_DB_USER}
    password: ${USER_DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-cookie-name: refreshToken
  idle-timeout-days: 7
  absolute-timeout-days: 30
  cookie-secure: false

email-service:
  url: ${EMAIL_SERVICE_URL:http://localhost:${MAIL_SERVICE_PORT:${EMAIL_SERVICE_PORT:8082}}}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

auth:
  cleanup:
    enabled: ${AUTH_CLEANUP_ENABLED:true}
    on-startup: ${AUTH_CLEANUP_ON_STARTUP:true}
    cron: ${AUTH_CLEANUP_CRON:0 0 3 * * ?}
