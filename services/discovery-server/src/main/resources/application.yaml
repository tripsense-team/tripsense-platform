spring:
  application:
    name: discovery-server

server:
  port: ${DISCOVERY_SERVER_PORT:${SERVER_PORT:8761}}
  shutdown: graceful

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
