server:
  port: ${TRIP_SERVICE_PORT:${SERVER_PORT:8084}}
  shutdown: graceful

spring:
  application:
    name: trip-service

  datasource:
    url: ${TRIP_DATASOURCE_URL}
    username: ${TRIP_DB_USER}
    password: ${TRIP_DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

  data:
    redis:
      repositories:
        enabled: false
      url: ${REDIS_URL}
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: ${TRIP_CACHE_TTL:10m}
      cache-null-values: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET}

place-service:
  url: ${PLACE_SERVICE_URL:http://localhost:${PLACE_SERVICE_PORT:8083}}

ai:
  commit-secret: ${AI_TRIP_COMMIT_SECRET:}

mail-service:
  url: ${EMAIL_SERVICE_URL:http://localhost:${MAIL_SERVICE_PORT:8082}}
  internal-api-key: ${MAIL_INTERNAL_API_KEY}

web-app:
  url: ${WEB_APP_URL:http://localhost:3000}

trip-collaboration:
  event-retention: ${TRIP_COLLABORATION_EVENT_RETENTION:24h}
  cleanup-delay-ms: ${TRIP_COLLABORATION_CLEANUP_DELAY_MS:3600000}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
