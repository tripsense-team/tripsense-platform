server:
  port: 0

spring:
  application:
    name: trip-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false

jwt:
  access-secret: test-access-secret-key-that-is-long-enough-for-hs256

place-service:
  url: http://localhost:9999
