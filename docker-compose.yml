services:
  db:
    image: postgres:15-alpine
    container_name: user-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tripsense_user
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mail-service:
    build:
      context: ./services/mail-service
      dockerfile: Dockerfile
    container_name: mail-service
    ports:
      - "8082:8082"
    env_file:
      - ./env/.env
    environment:
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_REGISTER=true
      - EUREKA_FETCH=true
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    env_file:
      - ./env/.env
    environment:
      - DB_HOST=db
      - EMAIL_SERVICE_URL=http://mail-service:8082
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_REGISTER=true
      - EUREKA_FETCH=true
    depends_on:
      - db
      - mail-service
    restart: unless-stopped

volumes:
  postgres_data:
