version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: user-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tripsense_user
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  user-service:
    build:
      context: ./services/UserService
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=
    depends_on:
      - db
    restart: unless-stopped

# Bạn có thể thêm các service khác vào đây sau này (TripService, PlaceService...)

volumes:
  postgres_data:
