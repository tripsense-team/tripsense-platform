services:
  db:
    image: postgres:15-alpine
    container_name: user-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tripsense_user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  discovery-server:
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    ports:
      - "8080:8080"
    restart: unless-stopped

  place-service:
    build:
      context: .
      dockerfile: services/place-service/Dockerfile
    container_name: place-service
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    ports:
      - "8083:8082"
    restart: unless-stopped

  email-service:
    build:
      context: ./services/EmailService
      dockerfile: Dockerfile
    container_name: email-service
    env_file:
    - path: ./env/.env
      required: false
    ports:
      - "8082:8082"
    restart: unless-stopped

  user-service:
    build:
      context: ./services/UserService
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
    - path: ./env/.env
      required: false
    environment:
      DB_HOST: db
      EMAIL_SERVICE_URL: http://email-service:8082
    depends_on:
      - db
      - email-service
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  postgres_data: