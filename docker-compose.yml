services:
  db:
    image: postgres:17-alpine
    container_name: user-postgres
    environment:
      POSTGRES_DB: tripsense_user
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  email-service:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_OWNER:-local}/${IMAGE_PROJECT:-tripsense}-email-service:${IMAGE_TAG:-latest}
    build:
      context: ./services/EmailService
      dockerfile: Dockerfile
    container_name: email-service
    ports:
      - "8082:8082"
    env_file:
      - path: ./env/.env
        required: false
    restart: unless-stopped

  discovery-server:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_OWNER:-local}/${IMAGE_PROJECT:-tripsense}-discovery-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    restart: unless-stopped

  api-gateway:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_OWNER:-local}/${IMAGE_PROJECT:-tripsense}-api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    ports:
      - "8080:8080"
    restart: unless-stopped

  place-service:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_OWNER:-local}/${IMAGE_PROJECT:-tripsense}-place-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/place-service/Dockerfile
    container_name: place-service
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    ports:
      - "8083:8082"
    restart: unless-stopped

  user-service:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_OWNER:-local}/${IMAGE_PROJECT:-tripsense}-user-service:${IMAGE_TAG:-latest}
    build:
      context: ./services/UserService
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
      - path: ./env/.env
        required: false
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      EMAIL_SERVICE_URL: http://email-service:8082
    depends_on:
      - db
      - email-service
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  postgres_data: