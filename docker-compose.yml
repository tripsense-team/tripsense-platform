services:

  # =========================
  # DATABASES
  # =========================

  db:
    image: postgres:17-alpine
    container_name: user-postgres
    environment:
      POSTGRES_DB: tripsense_user
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  trip-db:
    image: postgres:17-alpine
    container_name: trip-postgres
    environment:
      POSTGRES_DB: tripsense_trip
      POSTGRES_USER: ${TRIP_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TRIP_DB_PASS:-123456}
    ports:
      - "5433:5432"
    volumes:
      - trip_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  # =========================
  # REDIS
  # =========================

  redis:
    image: redis:7-alpine
    container_name: trip-redis
    ports:
      - "6379:6379"
    restart: unless-stopped


  # =========================
  # EUREKA
  # =========================

  discovery-server:
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile

    container_name: discovery-server

    ports:
      - "8761:8761"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped


  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile

    container_name: api-gateway

    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/

    depends_on:
      discovery-server:
        condition: service_healthy

    ports:
      - "8080:8080"

    restart: unless-stopped


  # =========================
  # PLACE SERVICE
  # =========================

  place-service:
    build:
      context: .
      dockerfile: services/place-service/Dockerfile

    container_name: place-service

    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/

    depends_on:
      discovery-server:
        condition: service_healthy

    ports:
      - "8083:8082"

    restart: unless-stopped


  # =========================
  # MAIL SERVICE
  # =========================

  mail-service:
    build:
      context: .
      dockerfile: services/mail-service/Dockerfile

    container_name: mail-service

    env_file:
      - ./env/.env

    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"

    depends_on:
      discovery-server:
        condition: service_healthy

    ports:
      - "8082:8082"

    restart: unless-stopped


  # =========================
  # USER SERVICE
  # =========================

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile

    container_name: user-service

    env_file:
      - ./env/.env

    environment:
      DB_HOST: db
      EMAIL_SERVICE_URL: http://mail-service:8082

      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"

    depends_on:
      db:
        condition: service_started

      mail-service:
        condition: service_started

      discovery-server:
        condition: service_healthy

    ports:
      - "8081:8081"

    restart: unless-stopped


  # =========================
  # TRIP SERVICE
  # =========================

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile

    container_name: trip-service

    env_file:
      - ./env/.env

    environment:
      TRIP_DB_HOST: trip-db
      TRIP_DB_PORT: "5432"

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"

    depends_on:
      trip-db:
        condition: service_started

      redis:
        condition: service_started

      discovery-server:
        condition: service_healthy

    ports:
      - "8084:8084"

    restart: unless-stopped


volumes:
  postgres_data:
  trip_postgres_data: