services:
  discovery-server:
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: user-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tripsense_user
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: place-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: place-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    env_file:
      - path: ./.env
        required: false
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - redis
    restart: unless-stopped

  mail-service:
    build:
      context: .
      dockerfile: services/mail-service/Dockerfile
    container_name: mail-service
    ports:
      - "8083:8082"
    env_file:
      - path: ./.env
        required: false
    environment:
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_REGISTER=true
      - EUREKA_FETCH=true
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    env_file:
      - path: ./.env
        required: false
    environment:
      - DB_HOST=db
      - EMAIL_SERVICE_URL=http://mail-service:8082
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_REGISTER=true
      - EUREKA_FETCH=true
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    depends_on:
      - db
      - mail-service
    restart: unless-stopped

  place-service:
    build:
      context: .
      dockerfile: services/place-service/Dockerfile
    container_name: place-service
    ports:
      - "8082:8082"
    env_file:
      - path: ./.env
        required: false
      - path: ./services/place-service/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/tripsense_places
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8082
      - ZIOMAP_BASE_URL=https://ziomap-api.socibi.com
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_REGISTER=true
      - EUREKA_FETCH=true
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - mongodb
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
