services:

  # =========================
  # DATABASES & CACHE
  # =========================

  db:
    image: postgres:17-alpine
    container_name: user-postgres
    environment:
      POSTGRES_DB: tripsense_user
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASS:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  trip-db:
    image: postgres:17-alpine
    container_name: trip-postgres
    environment:
      POSTGRES_DB: tripsense_trip
      POSTGRES_USER: ${TRIP_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TRIP_DB_PASS:-123456}
    ports:
      - "5433:5432"
    volumes:
      - trip_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  social-db:
    image: postgres:17-alpine
    container_name: social-postgres
    environment:
      POSTGRES_DB: ${SOCIAL_DB_NAME:-tripsense_social}
      POSTGRES_USER: ${SOCIAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASS:-123456}
    ports:
      - "5434:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: place-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tripsense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # =========================
  # EUREKA DISCOVERY SERVER
  # =========================

  discovery-server:
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - path: ./.env
        required: false
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  # =========================
  # PLACE SERVICE
  # =========================

  place-service:
    build:
      context: .
      dockerfile: services/place-service/Dockerfile
    container_name: place-service
    env_file:
      - path: ./.env
        required: false
      - path: ./services/place-service/.env
        required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017/tripsense_places
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8082
      ZIOMAP_BASE_URL: https://ziomap-api.socibi.com
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
    depends_on:
      discovery-server:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8082:8082"
    restart: unless-stopped

  # =========================
  # MAIL SERVICE
  # =========================

  mail-service:
    build:
      context: .
      dockerfile: services/mail-service/Dockerfile
    container_name: mail-service
    env_file:
      - path: ./.env
        required: false
      - path: ./env/.env
        required: false
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8083:8082"
    restart: unless-stopped

  # =========================
  # USER SERVICE
  # =========================

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    env_file:
      - path: ./.env
        required: false
      - path: ./env/.env
        required: false
    environment:
      USER_DB_HOST: db
      USER_DB_PORT: "5432"
      USER_DB_USER: ${USER_DB_USER:-postgres}
      USER_DB_PASS: ${USER_DB_PASS:-123456}
      EMAIL_SERVICE_URL: http://mail-service:8082
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
    depends_on:
      db:
        condition: service_started
      mail-service:
        condition: service_started
      discovery-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped

  # =========================
  # TRIP SERVICE
  # =========================

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    container_name: trip-service
    env_file:
      - path: ./.env
        required: false
      - path: ./env/.env
        required: false
    environment:
      TRIP_DB_HOST: trip-db
      TRIP_DB_PORT: "5432"
      TRIP_DB_USER: ${TRIP_DB_USER:-postgres}
      TRIP_DB_PASS: ${TRIP_DB_PASS:-123456}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PLACE_SERVICE_URL: http://place-service:8082
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
    depends_on:
      trip-db:
        condition: service_started
      redis:
        condition: service_started
      discovery-server:
        condition: service_healthy
    ports:
      - "8084:8084"
    restart: unless-stopped

  # =========================
  # SOCIAL SERVICE
  # =========================

  social-service:
    build:
      context: .
      dockerfile: services/social-service/Dockerfile
    container_name: social-service
    env_file:
      - path: ./env/.env
        required: true
    environment:
      SOCIAL_DB_HOST: social-db
      SOCIAL_DB_PORT: "5432"
      SOCIAL_DB_NAME: ${SOCIAL_DB_NAME:-tripsense_social}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER:-postgres}
      SOCIAL_DB_PASS: ${SOCIAL_DB_PASS:-123456}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
    depends_on:
      social-db:
        condition: service_started
      discovery-server:
        condition: service_healthy
    ports:
      - "8086:8086"
    restart: unless-stopped

  # =========================
  # DOCKER WEB UI (PORTAINER)
  # =========================

  portainer:
    image: portainer/portainer-ce:latest
    container_name: tripsense-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  trip_postgres_data:
  social_postgres_data:
  mongodb_data:
  redis_data:
  portainer_data:
